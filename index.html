<title>MushyFrog — Pixel Quest</title>
<style>

  }
  button { font:inherit; }
  .shell { width:min(1120px, 100%); }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 2px 12px; }
  .brand { display:flex; align-items:center; gap:10px; font-size:clamp(12px, 2vw, 16px); letter-spacing:.08em; font-weight:900; }
  .brand-mark { display:grid; place-items:center; width:40px; height:40px; flex:0 0 40px; overflow:hidden; border:1px solid #6489a9; border-radius:10px; background:#203957; box-shadow:0 4px 0 #4ba86b; }

  .tip { color:#a5b9d5; font-size:11px; text-align:right; }
  .top-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; }
  .install-button { border:1px solid #6ecb91; border-radius:8px; padding:7px 10px; color:#102f40; background:#a8f5b5; font-size:11px; font-weight:900; cursor:pointer; }
  .install-button[hidden] { display:none; }
  .frame { padding:8px; border-radius:18px; background:linear-gradient(135deg,#8cb5dc,#344c78 42%,#172641); box-shadow:0 22px 80px #0008, inset 0 1px #ffffff66; }
  .game-stage { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:11px; background:#4c77d0; isolation:isolate; }
  canvas { position:absolute; inset:0; display:block; width:100%; height:100%; aspect-ratio:16/9; border-radius:11px; background:#4c77d0; image-rendering:pixelated; outline:none; touch-action:none; }
  .touch-controls { position:absolute; inset:0; z-index:5; pointer-events:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  .touch-controls[hidden] { display:none !important; }
  .move-pad { position:absolute; left:2.5%; bottom:3.5%; display:flex; gap:clamp(10px, 2vw, 18px); pointer-events:none; }

  .touch-btn:active, .touch-btn.pressed { transform:translateY(3px) scale(.97); background:#385879eF; box-shadow:0 1px 0 #0a1529a8, inset 0 1px #ffffff38; }
  .jump-btn { position:absolute; right:2.8%; bottom:3.5%; width:clamp(108px, calc(24svh * var(--touch-scale)), 158px); height:clamp(84px, calc(18svh * var(--touch-scale)), 118px); border-color:#d4ffe0; border-radius:24px; color:#15334a; background:#93f0aadd; font-size:clamp(15px, 2.8vh, 21px); letter-spacing:.04em; box-shadow:0 6px 0 #317c61, inset 0 1px #ffffffa8; }

</style>

  drawSlider('TAMANHO DOS BOTÕES (CELULAR)','controlScale',315,288,300,0.85,1.5,`${Math.round(settings.controlScale*100)}%`);
  buttons=[];drawButton(225,337,238,38,`MÚSICA: ${settings.musicEnabled?'LIGADA':'DESLIGADA'}`,()=>{settings.musicEnabled=!settings.musicEnabled;applySettings();saveSettings();},settings.musicEnabled?'primary':'secondary');
  drawButton(497,337,238,38,`EFEITOS: ${settings.sfxEnabled?'LIGADOS':'DESLIGADOS'}`,()=>{settings.sfxEnabled=!settings.sfxEnabled;applySettings();saveSettings();},settings.sfxEnabled?'primary':'secondary');
  drawButton(360,394,240,39,'SALVAR E VOLTAR',()=>{saveSettings();state=settingsReturnState;},'secondary');
  text('As preferências ficam salvas neste dispositivo.',W/2,452,10,'#b8cee5','center','700');
}
function drawOverlay(title,subtitle,opts) {
  drawPanel();const many=opts.length>=4;roundedRect(235,many?88:122,490,many?365:302,18,'#142741f4','#85a5c7',2);
  text(title,W/2,many?126:172,29,'#a5f5b5','center','900');text(subtitle,W/2,many?166:213,12,'#d3e4f5','center','700');
  buttons=[];let y=many?202:252;for(const b of opts){drawButton(335,y,290,many?39:42,b.label,b.action,b.style||'secondary');y+=many?47:52;}
}
async function loadLeaderboard() {
  leaderboardLoading = true;
  leaderboardMessage = 'Carregando ranking...';
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=player_name,score,created_at&order=score.desc,created_at.asc&limit=10`, {
      headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}` }
    });
    if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
    leaderboardRows = await response.json();
    leaderboardMessage = leaderboardRows.length ? '' : 'Ainda não há pontuações. Seja o primeiro!';
  } catch (error) {
    console.error('Falha ao carregar ranking:', error);
    leaderboardMessage = 'Não foi possível carregar. Verifique a conexão e as políticas RLS.';
  } finally {
    leaderboardLoading = false;
  }
}
async function submitGlobalScore() {
  if (scoreSubmissionHandled || score <= 0) return;
  scoreSubmissionHandled = true;
  const entered = window.prompt(`Você fez ${score} pontos!\nDigite um apelido para o ranking global (1 a 16 caracteres):`, 'Sapinho');
  if (entered === null) return;
  const playerName = entered.trim().replace(/\s+/g, ' ').slice(0, 16);
  if (!playerName) {
    leaderboardMessage = 'Apelido vazio: sua pontuação não foi enviada.';
    return;
  }
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ player_name: playerName, score: Math.max(0, Math.floor(score)) })
    });
    if (!response.ok) {
      const details = await response.text();
      throw new Error(`Erro HTTP ${response.status}: ${details}`);
    }
    leaderboardMessage = 'Pontuação enviada ao ranking global!';
    await loadLeaderboard();
  } catch (error) {
    console.error('Falha ao enviar pontuação:', error);
    leaderboardMessage = 'Não foi possível enviar a pontuação. Confira a conexão e as políticas RLS.';
  }
}
function openLeaderboard() { state = 'leaderboard'; loadLeaderboard(); }
function drawLeaderboard(t) {
  drawMenu(t); drawPanel();
  roundedRect(130,42,700,456,18,'#142741f7','#81a2c7',2);
  text('RANKING GLOBAL',W/2,77,25,'#a4f6b5','center','900');
  text('TOP 10 • MELHORES PONTUAÇÕES',W/2,108,11,'#d3e4f5','center','800');
  if (leaderboardLoading) text('Carregando...',W/2,230,14,'#fff2a5','center');
  else if (leaderboardRows.length) {
    leaderboardRows.forEach((row,i)=>{
      const y=145+i*27;
      roundedRect(180,y-12,600,23,5,i===0?'#4a604c':(i%2?'#203651':'#192d47'),i===0?'#9df5ad':'#344b68',1);
      text(String(i+1).padStart(2,'0'),202,y,12,i===0?'#ffe18a':'#9fb9d7','left','900');
      let name=String(row.player_name||'Anônimo').slice(0,16);
      text(name,230,y,12,'#f0f7ff','left','800');
      text(`${Number(row.score)||0} pts`,754,y,12,'#ffe9a4','right','900');
    });
  } else text(leaderboardMessage||'Ainda não há pontuações.',W/2,230,12,'#d3e4f5','center','700');
  if (leaderboardMessage && leaderboardRows.length) text(leaderboardMessage,W/2,430,9,'#b8cee5','center','700');
  buttons=[];
  drawButton(360,452,240,32,'VOLTAR AO MENU',()=>state='menu','primary');
}

function render(t) {
  buttons=[]; sliderRegions=[];
  if(state==='menu')drawMenu(t);
  else if(state==='leaderboard')drawLeaderboard(t);
  else if(state==='instructions')drawInstructions(t);
  else if(state==='levelselect')drawLevelSelect(t);
  else if(state==='settings')drawSettings(t);
  else if(level){drawWorld(t);drawHud();
    if(state==='paused')drawOverlay('PAUSADO','Respire. A aventura fica congelada.',[
      {label:'CONTINUAR',action:()=>state='playing',style:'primary'},
      {label:'REINICIAR FASE',action:()=>restartLevel()},
      {label:'CONFIGURAÇÕES',action:()=>{settingsReturnState='paused';state='settings';}},
      {label:'VOLTAR AO MENU',action:()=>state='menu'}
    ]);
    else if(state==='levelcomplete'){
      const got=level.coins.filter(c=>c.taken).length,total=level.coins.length;
      drawOverlay(levelIndex<levels.length-1?'FASE CONCLUÍDA!':'AVENTURA CONCLUÍDA!',`${level.name} • ${got}/${total} moedas • Pontos ${score}${got===total?' • PERFEITA!':''}`,[
        {label:levelIndex<levels.length-1?'PRÓXIMA FASE →':'VER RESULTADO →',action:()=>nextLevel(),style:'primary'},
        {label:'RECOMEÇAR CAMPANHA',action:()=>restartCampaign()},
        {label:'MENU PRINCIPAL',action:()=>state='menu'}
      ]);
    } else if(state==='gameover')drawOverlay('FIM DE JOGO','Suas três vidas acabaram. Tente outra rota!',[
      {label:'TENTAR NOVAMENTE',action:()=>restartCampaign(),style:'primary'},
      {label:'MENU PRINCIPAL',action:()=>state='menu'}
    ]);
    else if(state==='win')drawOverlay('VOCÊ CONSEGUIU!','O pântano foi salvo! A aventura agora é sua lenda.',[
      {label:`JOGAR NOVAMENTE • ${score} PONTOS`,action:()=>restartCampaign(),style:'primary'},
      {label:'MENU PRINCIPAL',action:()=>state='menu'}
    ]);
  }
}
function frame(now) {
  const dt=Math.min(.033,(now-lastTimestamp)/1000||0);lastTimestamp=now;
  if ((state==='gameover'||state==='win') && !scoreSubmissionHandled) submitGlobalScore();
  if(state==='playing')update(dt);
  render(now/1000);
  justPressed.clear();requestAnimationFrame(frame);
}
function canvasPoint(e) {const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener('pointermove',e=>{mouse=canvasPoint(e);});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown',e=>{mouse=canvasPoint(e);canvas.focus();ensureAudio();});
canvas.addEventListener('click',e=>{const p=canvasPoint(e);if(state==='settings'){const reg=sliderRegions.find(r=>p.x>=r.x-8&&p.x<=r.x+r.w+35&&p.y>=r.y&&p.y<=r.y+r.h);if(reg){playSfx('click');settings[reg.key]=reg.min+clamp((p.x-reg.x)/reg.w,0,1)*(reg.max-reg.min);applySettings();saveSettings();return;}}for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){playSfx('click');b.action();break;}}});
window.addEventListener('keydown',e=>{
  ensureAudio(); const code=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(code))e.preventDefault();
  if(!keys.has(code))justPressed.add(code);keys.add(code);
  if(e.repeat)return;
  if(code==='KeyR'){restartLevel();return;}
  if(code==='Escape'||code==='KeyP'){
    if(state==='playing')state='paused';else if(state==='paused')state='playing';else if(state==='instructions'||state==='levelselect')state='menu';else if(state==='settings')state=settingsReturnState;return;
  }
  if(code==='Enter'){
    if(state==='menu')beginCampaign();else if(state==='paused')state='playing';else if(state==='instructions'||state==='levelselect'||state==='settings'||state==='leaderboard')state='menu';else if(state==='levelcomplete')nextLevel();else if(state==='gameover'||state==='win')restartCampaign();
  }
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();if(state==='playing')state='paused';});
// Controles de toque em HTML: suportam múltiplos dedos e não dependem do teclado.
const touchControls = document.getElementById('touch-controls');
const rotateHint = document.getElementById('rotate-hint');
const pauseTouchButton = document.getElementById('pause-touch');
const fullscreenTouchButton = document.getElementById('fullscreen-touch');
const installButton = document.getElementById('install-app');
const touchCapable = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
const touchHeld = new Set();
const activeTouchPointers = new Map();

function releaseTouchPointer(pointerId) {
  const active = activeTouchPointers.get(pointerId);
  if (!active) return;
  activeTouchPointers.delete(pointerId);
  if (![...activeTouchPointers.values()].some(v => v.key === active.key)) touchHeld.delete(active.key);
  if (![...activeTouchPointers.values()].some(v => v.button === active.button)) active.button.classList.remove('pressed');
}

touchControls.querySelectorAll('[data-touch]').forEach(button => {
  button.addEventListener('pointerdown', e => {
    ensureAudio(); if (state !== 'playing') return;
    e.preventDefault();
    e.stopPropagation();
    if (activeTouchPointers.has(e.pointerId)) return;
    const key = button.dataset.touch;
    activeTouchPointers.set(e.pointerId, { key, button });
    touchHeld.add(key);
    if (key === 'Space') justPressed.add('Space');
    button.classList.add('pressed');
    try { button.setPointerCapture(e.pointerId); } catch (_) {}
  });
  button.addEventListener('pointerup', e => { e.preventDefault(); releaseTouchPointer(e.pointerId); });
  button.addEventListener('pointercancel', e => releaseTouchPointer(e.pointerId));
  button.addEventListener('lostpointercapture', e => releaseTouchPointer(e.pointerId));
  button.addEventListener('contextmenu', e => e.preventDefault());
});
window.addEventListener('pointerup', e => releaseTouchPointer(e.pointerId));
window.addEventListener('pointercancel', e => releaseTouchPointer(e.pointerId));
window.addEventListener('blur', () => {
  touchHeld.clear();
  activeTouchPointers.clear();
  touchControls.querySelectorAll('.pressed').forEach(button => button.classList.remove('pressed'));
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') state = 'paused';
  if (document.hidden) {
    touchHeld.clear();
    activeTouchPointers.clear();
    touchControls.querySelectorAll('.pressed').forEach(button => button.classList.remove('pressed'));
  }
});

pauseTouchButton.addEventListener('click', e => {
  ensureAudio(); e.preventDefault(); e.stopPropagation();
  if (state === 'playing') state = 'paused';
});
fullscreenTouchButton.addEventListener('click', async e => {
  ensureAudio(); e.preventDefault(); e.stopPropagation();
  const stage = document.getElementById('game-stage');
  try {
    if (!document.fullscreenElement && stage.requestFullscreen) await stage.requestFullscreen();
    else if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
  } catch (_) { /* Alguns navegadores móveis não oferecem tela cheia para elementos comuns. */ }
});

function syncMobileUI() {
  const showTouchControls = touchCapable && state === 'playing';
  touchControls.hidden = !showTouchControls;
  const portrait = window.matchMedia('(orientation: portrait)').matches;
  rotateHint.hidden = !(showTouchControls && portrait);
}

// Botão de instalação opcional: aparece apenas em navegadores que oferecem instalação PWA.
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installButton.hidden = false;
});
installButton.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installButton.hidden = true;
});
window.addEventListener('appinstalled', () => {
  installButton.hidden = true;
  deferredInstallPrompt = null;
});

// Registrar o service worker habilita cache offline e instalação PWA em hospedagem HTTPS.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.warn('Não foi possível registrar o modo offline:', err));
  });
}

window.addEventListener('resize', syncMobileUI);
const originalRender = render;
render = function(t) { originalRender(t); syncMobileUI(); };
requestAnimationFrame(frame);
})();
</script>
